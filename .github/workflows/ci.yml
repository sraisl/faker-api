name: CI

on:
  push:
    branches: 
      - main
    
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: test
        run: |
          go mod tidy
          go vet
        
