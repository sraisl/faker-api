name: CI

on:
  push:
    branches: 
      - main
      - feature/**
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'Dockerfile'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'Dockerfile'
    
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: test
        run: |
          go mod tidy
          go vet -v ./... && echo "✅ go vet: No issues found." >> $GITHUB_STEP_SUMMARY || echo "❌ go vet: Issues found." >> $GITHUB_STEP_SUMMARY
          go test -v ./... && echo "✅ go test: All tests passed." >> $GITHUB_STEP_SUMMARY || echo "❌ go test: Some tests failed." >> $GITHUB_STEP_SUMMARY

      - name: lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  coverage:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: coverage
        run: |
          go mod tidy
          go test -coverprofile=coverage.out ./... && echo "✅ Code coverage report generated." >> $GITHUB_STEP_SUMMARY || echo "❌ Failed to generate code coverage report." >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tee coverage.txt && echo "✅ Code coverage details:" >> $GITHUB_STEP_SUMMARY && cat coverage.txt >> $GITHUB_STEP_SUMMARY
        
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: build
        run: |
          go mod tidy
          go build -o faker-api .
  
  docker-build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: test
    outputs:
      DOCKER_TAG: ${{ steps.set_docker_tag.outputs.docker_tag }}

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: faker-api

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: set docker tag
        id: set_docker_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "DOCKER_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "docker_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DOCKER_TAG=snapshot" >> $GITHUB_ENV
            echo "docker_tag=snapshot" >> $GITHUB_OUTPUT
          else
            echo "DOCKER_TAG=${{ github.sha }}" >> $GITHUB_ENV
            echo "docker_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/faker-api:${{ steps.set_docker_tag.outputs.docker_tag }}

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/faker-api:${{ needs.docker-build.outputs.DOCKER_TAG }}

      - name: Run container
        run: |
          docker run -d --name faker-api-test -p 8888:8888 ghcr.io/${{ github.repository_owner }}/faker-api:${{ needs.docker-build.outputs.DOCKER_TAG }}
          sleep 5 # Wait for the container to start

      - name: Smoke test
        run: |
          if curl -s http://localhost:8888/greeting/Alice | grep "Hello, Alice!"; then
            echo "✅ Smoke test passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Smoke test failed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Cleanup
        run: |
          docker stop faker-api-test
          docker rm faker-api-test

  release:
    runs-on: ubuntu-latest
    needs:
      - test
      - coverage
      - docker-build
      - docker-smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.1

      - name: Validate SemVer tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid semver tag: $TAG"
          exit 1
          fi
          echo "Validated tag: $TAG"

      - name: create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
  
  update-helm-chart:
    name: Update Helm chart
    needs:
      - publish-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger helm-charts update
        run: |
          gh workflow run update-chart.yml \
            --repo sraisl/helm-charts \
            --ref main \
            -f chart=faker-api \
            -f app_version=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN }}