name: CI

on:
  push:
    branches: 
      - main
    
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: test
        run: |
          go mod tidy
          go vet -v ./... && echo "✅ go vet: No issues found." >> $GITHUB_STEP_SUMMARY || echo "❌ go vet: Issues found." >> $GITHUB_STEP_SUMMARY
          go test -v ./... && echo "✅ go test: All tests passed." >> $GITHUB_STEP_SUMMARY || echo "❌ go test: Some tests failed." >> $GITHUB_STEP_SUMMARY
        
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: build
        run: |
          go mod tidy
          go build -o faker-api .
  
  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: faker-api

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: set docker tag
        run: |
           if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DOCKER_TAG=snapshot" >> $GITHUB_ENV
            else
            echo "DOCKER_TAG=${{ github.sha }}" >> $GITHUB_ENV
            fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/faker-api:${{ env.DOCKER_TAG }}

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/faker-api:${{ env.DOCKER_TAG }}

      - name: Run container
        run: |
          docker run -d --name faker-api-test -p 8888:8888 ghcr.io/${{ github.repository_owner }}/faker-api:${{ env.DOCKER_TAG }}
          sleep 5 # Wait for the container to start

      - name: Smoke test
        run: |
          if curl -s http://localhost:8888/health | grep "OK"; then
            echo "✅ Smoke test passed."
          else
            echo "❌ Smoke test failed."
            exit 1
          fi

      - name: Cleanup
        run: |
          docker stop faker-api-test
          docker rm faker-api-test
  