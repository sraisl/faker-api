name: CI

on:
  push:
    branches: 
      - main
    
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: test
        run: |
          go mod tidy
          go vet -v ./... && echo "✅ go vet: No issues found." >> $GITHUB_STEP_SUMMARY || echo "❌ go vet: Issues found." >> $GITHUB_STEP_SUMMARY
          go test -v ./... && echo "✅ go test: All tests passed." >> $GITHUB_STEP_SUMMARY || echo "❌ go test: Some tests failed." >> $
        
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup GoLang
        uses: actions/setup-go@v6
        with:
           go-version-file: 'go.mod'
           cache: true

      - name: build
        run: |
          go mod tidy
          go build -o faker-api .
  
  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: user/app:latest