name: Semgrep

on:
  workflow_dispatch: 
  pull_request: {}
  push:
    branches:
      - main

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Semgrep and write summary
        shell: bash
        run: |
          set +e

          {
            echo "# Semgrep Scan"
            echo
            echo '```'
            semgrep scan --config p/default --error
            status=$?
            echo '```'
            echo
            echo "**Exit Code:** $status"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
